[phases.setup]
nixPkgs = [
  "python311",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "libXcomposite",
  "libXdamage",
  "libXrandr",
  "mesa",
  "libgbm",
  "libxkbcommon",
  "pango",
  "cairo",
  "alsa-lib"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium --with-deps"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
