[phases.setup]
nixPkgs = [
  "python311",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXrandr",
  "mesa",
  "libxkbcommon",
  "pango",
  "cairo",
  "alsa-lib"
]

[phases.install]
cmds = [
  "python3.11 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  ". /opt/venv/bin/activate && playwright install chromium"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
